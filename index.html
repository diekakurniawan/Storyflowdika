:root{
  --bg:#0A0F2A;
  --surface:#111737;
  --surface2:#18204A;
  --surface3:#1E2A5E;
  --line:#2A3670;
  --gold:#FACC15;
  --gold2:#FDE047;
  --ink:#F8FAFF;
  --muted:#A9B3D8;
  --muted2:#7E89B8;
  --green:#34D399;
  --red:#FB7185;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}
*{
  box-sizing:border-box
}
html{
  background:var(--bg)
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif
}
button,input,select,textarea{
  font:inherit
}
button{
  cursor:pointer
}
select,input,textarea{
  background:#0B1130;
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:12px;
  padding:10px 12px;
  outline:none;
  width:100%
}
select:focus,input:focus,textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(250,204,21,.18)
}
input[type=range]{
  padding:0;
  accent-color:var(--gold)
}
input[type=checkbox]{
  width:18px;
  height:18px;
  accent-color:var(--gold)
}
@keyframes kenburns{
  0%{
    transform:scale(1) translate(0,0)
  }
  100%{
    transform:scale(1.18) translate(-2%,-2%)
  }
}
@keyframes riseIn{
  from{
    opacity:0;
    transform:translateY(14px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}
@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(250,204,21,.35)
  }
  50%{
    box-shadow:0 0 0 8px rgba(250,204,21,0)
  }
}
@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }
  50%{
    transform:translateY(-10px) rotate(3deg)
  }
}
@keyframes marquee{
  from{
    transform:translateX(0)
  }
  to{
    transform:translateX(-50%)
  }
}
.anim-kenburns{
  animation:kenburns 6s ease-in-out infinite alternate
}
.anim-rise{
  animation:riseIn .45s ease both
}
.anim-float{
  animation:floaty 4s ease-in-out infinite
}
.anim-pulse{
  animation:pulseGold 1.8s infinite
}
.transition-fade{
  animation:riseIn .6s ease both
}
.transition-slide-left{
  animation:slideL .55s ease both
}
.transition-slide-right{
  animation:slideR .55s ease both
}
.transition-zoom-in{
  animation:zoomIn .6s ease both
}
.transition-zoom-out{
  animation:zoomOut .6s ease both
}
.transition-blur{
  animation:blurIn .6s ease both
}
.transition-putar{
  animation:spinIn .6s ease both
}
.transition-glitch{
  animation:glitch .35s steps(2) 2
}
@keyframes slideL{
  from{
    opacity:0;
    transform:translateX(70px)
  }
  to{
    opacity:1;
    transform:translateX(0)
  }
}
@keyframes slideR{
  from{
    opacity:0;
    transform:translateX(-70px)
  }
  to{
    opacity:1;
    transform:translateX(0)
  }
}
@keyframes zoomIn{
  from{
    opacity:0;
    transform:scale(1.35)
  }
  to{
    opacity:1;
    transform:scale(1)
  }
}
@keyframes zoomOut{
  from{
    opacity:.2;
    transform:scale(.75)
  }
  to{
    opacity:1;
    transform:scale(1)
  }
}
@keyframes blurIn{
  from{
    opacity:0;
    filter:blur(14px)
  }
  to{
    opacity:1;
    filter:blur(0)
  }
}
@keyframes spinIn{
  from{
    opacity:0;
    transform:rotate(10deg) scale(.9)
  }
  to{
    opacity:1;
    transform:rotate(0) scale(1)
  }
}
@keyframes glitch{
  0%{
    transform:translate(0);
    filter:hue-rotate(0)
  }
  25%{
    transform:translate(-6px,3px);
    filter:hue-rotate(90deg)
  }
  50%{
    transform:translate(6px,-3px)
  }
  75%{
    transform:translate(-3px,-2px);
    filter:invert(.2)
  }
  100%{
    transform:translate(0)
  }
}
.scroll-thin::-webkit-scrollbar{
  height:6px;
  width:6px
}
.scroll-thin::-webkit-scrollbar-thumb{
  background:#35407A;
  border-radius:99px
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#0A0F2A;
    --surface:#111737;
    --surface2:#18204A;
    --ink:#F8FAFF;
    --muted:#A9B3D8
  }
}
@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }
  .sm\:block {
    display: block;
  }
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:p-4 {
    padding: 1rem;
  }
  .sm\:p-5 {
    padding: 1.25rem;
  }
  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:py-6 {
    padding-top: 1.5rem;
    padding-bottom: 1.5rem;
  }
  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }
  .sm\:text-\[110px\] {
    font-size: 110px;
  }
  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px) {
  .md\:inline-flex {
    display: inline-flex;
  }
}
@media (min-width: 1024px) {
  .lg\:col-span-1 {
    grid-column: span 1 / span 1;
  }
  .lg\:flex {
    display: flex;
  }
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .lg\:grid-cols-\[440px_minmax\(0\2c 1fr\)\] {
